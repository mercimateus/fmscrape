[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmscrape"
version = "0.1.1"
description = "Last.fm public HTML scraper with an API-compatible interface (no API key required)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["fmscrape*"]

[tool.pytest.ini_options]
markers = [
    "live: marks tests that hit live last.fm (deselected by default)",
]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

